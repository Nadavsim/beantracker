roasters:
  - slug: nomena
    name: Nomena Roasters
    base_url: https://nomenaroasters.com
    adapter: shopify
    currency: ILS
    options:
      # Nomena lists a lighter roast of some beans as a second product, "<bean>-light".
      roast_from_handle: {"-light": light}
  - slug: september
    name: September Coffee
    base_url: https://september.coffee
    adapter: shopify
    currency: USD
    options:
      # Gear and consumables share the catalog with beans.
      exclude_product_types: [gear]
      # Gear, consumables and merchandise share the feed with the beans.
      exclude_title_keywords:
        [filters, brew water, espresso tonic, seasoning, gift card, subscription, brewer, crewneck, beanie]
      # The feed has no description, so origin, process and roast level are only on each
      # product page. Read the pages of what is in stock (a few dozen requests per run).
      details_from_pages: {parser: parameter_list, only: in_stock}
  - slug: hydrangea
    name: Hydrangea Coffee Roasters
    base_url: https://hydrangea.coffee
    adapter: shopify
    currency: USD
    options:
      exclude_product_types: [gear, cupping]
      exclude_title_keywords: [gift card, mineral concentrate, double walled, packs]
  - slug: dak
    name: DAK Coffee Roasters
    base_url: https://www.dakcoffeeroasters.com
    adapter: dak
    currency: EUR
