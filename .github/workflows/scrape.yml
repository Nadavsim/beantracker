name: scrape

# Scrapes every configured roaster into the persistent database behind the DATABASE_URL secret
# (Neon Postgres). Unlike `canary`, which uses a throwaway database and only proves the adapters
# still work, this one keeps the history: each run adds a snapshot of every price and stock level.
#
# Once a day, at an odd minute so it does not queue with everyone else's top-of-the-hour jobs.
# Same polite rules as any run: robots.txt, per-host rate limit, descriptive User-Agent.
# A failed roaster fails the job, so GitHub emails the repo owner. Delete this file to stop it.
on:
  schedule:
    - cron: "23 4 * * *"  # every day 04:23 UTC
  workflow_dispatch:

# Two overlapping runs would double-write snapshots; queue instead of racing.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Idempotent: applies only migrations the database has not seen.
      - run: uv run beantracker db upgrade
      # No --strict here: a coverage warning is stored on the run and shown by `runs list`, but
      # only a failed run (nothing found, an error) should page the owner. The canary is strict.
      - run: uv run beantracker scrape-all
      - run: uv run beantracker runs list --limit 12
