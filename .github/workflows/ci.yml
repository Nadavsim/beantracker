name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beantracker
          POSTGRES_PASSWORD: beantracker
          POSTGRES_DB: beantracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beantracker" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://beantracker:beantracker@localhost:5432/beantracker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
